<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowPDF - Purr-fect PDF Splitter 🐾</title>
    <!-- pdf-lib CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --light-blue: #e0f2fe;
            --sky-blue: #7dd3fc;
            --primary-blue: #0284c7;
            --dark-navy: #0f172a;
            --white: #ffffff;
            --paw-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-blue);
            color: var(--dark-navy);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(var(--sky-blue) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative paws */
        .container::before, .container::after {
            content: "🐾";
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
        }
        .container::before { top: 20px; left: 20px; transform: rotate(-30deg); }
        .container::after { bottom: 20px; right: 20px; transform: rotate(150deg); }

        h1 {
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .drop-zone {
            border: 3px dashed var(--sky-blue);
            border-radius: 16px;
            padding: 3rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            margin-bottom: 1.5rem;
        }

        .drop-zone.dragover {
            border-color: var(--primary-blue);
            background-color: var(--light-blue);
            transform: scale(1.02);
        }

        .drop-zone p {
            font-size: 1.1rem;
            color: var(--primary-blue);
            font-weight: 500;
        }

        .cat-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .cat-icon {
            transform: translateY(-5px);
        }

        input[type="file"] {
            display: none;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark-navy);
        }

        .radio-label input {
            margin-right: 8px;
            accent-color: var(--primary-blue);
            width: 18px;
            height: 18px;
        }

        .btn {
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 999px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .btn:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading Animation */
        .loader {
            display: none;
            margin-top: 1rem;
            font-size: 1.2rem;
            color: var(--primary-blue);
            font-weight: bold;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bouncing-cat {
            display: inline-block;
            animation: bounce 1s infinite;
        }

        #fileName {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--primary-blue);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MeowPDF Splitter 🐱</h1>
        <p class="subtitle">Slice all the pages in your PDF, purr-fectly!</p>

        <div class="drop-zone" id="dropZone">
            <div class="cat-icon" id="catIcon">😺</div>
            <p>Drag & Drop your PDF here, meow!</p>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">or click to select file</p>
            <div id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept="application/pdf">

        <div class="options">
            <label class="radio-label">
                <input type="radio" name="splitDir" value="horizontal" checked>
                Top / Bottom 🍔
            </label>
            <label class="radio-label">
                <input type="radio" name="splitDir" value="vertical">
                Left / Right 🌭
            </label>
        </div>

        <button class="btn" id="splitBtn" disabled>Purr-fectly Split! 🐾</button>

        <div class="loader" id="loader">
            <span class="bouncing-cat">🐈</span> Splitting your PDF pages...
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const splitBtn = document.getElementById('splitBtn');
        const catIcon = document.getElementById('catIcon');
        const loader = document.getElementById('loader');

        let selectedFile = null;

        // --- Drag and Drop Handlers ---
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
            catIcon.textContent = '🙀'; 
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
            catIcon.textContent = selectedFile ? '😻' : '😺';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                alert('Meow! Please upload a valid PDF file.');
                return;
            }
            selectedFile = file;
            fileNameDisplay.textContent = `📄 ${file.name}`;
            catIcon.textContent = '😻'; 
            splitBtn.disabled = false;
        }

        // --- Multi-Page PDF Splitting Logic ---
        splitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // UI Loading state
            splitBtn.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Read the file
                const arrayBuffer = await selectedFile.arrayBuffer();
                
                // Load original PDF
                const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pageCount = srcDoc.getPageCount();

                if (pageCount < 1) {
                    throw new Error("This PDF seems to be empty, meow!");
                }

                // Get direction
                const direction = document.querySelector('input[name="splitDir"]:checked').value;

                // Create a new empty PDF
                const outDoc = await PDFLib.PDFDocument.create();

                // Loop through EVERY page in the document
                for (let i = 0; i < pageCount; i++) {
                    // Copy the current page twice into the new document
                    const [part1] = await outDoc.copyPages(srcDoc, [i]);
                    const [part2] = await outDoc.copyPages(srcDoc, [i]);

                    // Add both parts to the final document sequentially
                    outDoc.addPage(part1);
                    outDoc.addPage(part2);

                    // Get original dimensions
                    const { width, height } = part1.getSize();

                    // Apply cropping based on selected direction
                    if (direction === 'horizontal') {
                        // Part 1: Top Half
                        part1.setCropBox(0, height / 2, width, height / 2);
                        // Part 2: Bottom Half
                        part2.setCropBox(0, 0, width, height / 2);
                    } else {
                        // Part 1: Left Half
                        part1.setCropBox(0, 0, width / 2, height);
                        // Part 2: Right Half
                        part2.setCropBox(width / 2, 0, width / 2, height);
                    }
                }

                // Save the new multi-page PDF
                const pdfBytes = await outDoc.save();

                // Trigger download
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `split_${selectedFile.name}`;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

            } catch (error) {
                console.error(error);
                alert('Oops! Something went wrong while slicing your PDF: ' + error.message);
            } finally {
                // Restore UI
                splitBtn.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
